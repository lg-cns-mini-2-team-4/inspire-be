[versions]
jjwt = "0.11.5"
springdoc-swagger = "2.8.16"
jackson = "2.18.4"
springcloud-openfeign = "4.2.0"

[libraries]
# JJWT

jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# Jackson
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson"}

# Swagger Springdoc
springdoc-swagger = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-swagger"}
springdoc-swagger-reactive = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc-swagger"}

# Spring Cloud
springcloud-openfeign = { module = "org.springframework.cloud:spring-cloud-starter-openfeign", version.ref = "springcloud-openfeign" }