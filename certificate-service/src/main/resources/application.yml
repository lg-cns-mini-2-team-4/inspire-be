# eks 배포 시 apigateway는 eureka server에 등록하지 않겠다, 라는 의미
eureka:
  client:
    enabled: false

spring:
  application:
    name: certificate-service # 이름

  # mariadb settings
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/inspire?useSSL=true&verifyServerCertificate=false
    username: root
    password: 123456789
    # url: jdbc:mariadb://${DB_HOST}:3306/inspire?useSSL=true&verifyServerCertificate=false
    # username: ${DB_ADMIN}
    # password: ${DB_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate: 
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true # 쿼리를 보기 좋게 줄바꿈하여 출력

  kafka:
    kafka-server: localhost:9092
    # # pod 실행 중인 service 이름으로 변경 (localhost X)
    # kafka-server: kafka-service:9092

# # Feign + CircuitBreaker 트랜젝션 처리
feign:
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      productService:
        failure-rate-threshold: 40
        wait-duration-in-open-state: 10s