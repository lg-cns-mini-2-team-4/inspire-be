plugins {
    // 💡 팀원이 도입한 공통 컨벤션 플러그인 유지
    id 'spring-web-conventions'
}

version = '1.0.0'

dependencies {
    // --- [팀원의 최신 공통 세팅] ---
    implementation project(':common:contract')
    implementation libs.springdoc.swagger
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // --- [certificate-service 필수 기능 복구!] ---
    // 공공API 호출 및 XML 파싱용
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    // MSA 통신용 (Eureka, Kafka, Feign, Circuit Breaker)
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
}

// 💡 MSA(Spring Cloud) 라이브러리들의 버전 충돌을 막기 위해 경훈 님의 설정 유지
dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2024.0.0'
    }
}