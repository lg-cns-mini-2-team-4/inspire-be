plugins {
    id 'spring-web-conventions'
	id 'spring-cloud-conventions'
}

version = '1.0.0'

dependencies {
	implementation project(':common:contract')
	implementation project(':common:binding')
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation libs.springdoc.swagger
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// implementation libs.springcloud.openfeign

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
}