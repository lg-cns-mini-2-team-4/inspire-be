apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-deployment
  namespace: lgcns

spec:
  revisionHistoryLimit: 3
  replicas: 1
  selector:
    matchLabels:
      app: user

  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: 613307913976.dkr.ecr.ap-northeast-2.amazonaws.com/user:latest  # ECR 경로

          ports:
          - containerPort: 8080
          
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: common-db-secret
                  key: DB_HOST
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: common-db-secret
                  key: DB_ADMIN
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: common-db-secret
                  key: DB_PASSWORD

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mariadb://$(DATABASE_HOST):3306/user?useSSL=true&verifyServerCertificate=false"

---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: lgcns
spec:
  selector:
    app: user
  ports:
    - port: 80
      targetPort: 8080