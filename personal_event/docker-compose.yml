version: '3' 

services:

  backend:
  
    image: seoyoomi/inspire-monolithic
    container_name: monolithic-backend-container
    ports:
      - "8888:8888"
    environment:
      # lical DB
      # SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/inspire

      # RDS
      SPRING_DATASOURCE_URL: jdbc:mariadb://lgcns-seoyoomi.cz6iyaui8uhg.us-west-1.rds.amazonaws.com:3306/inspire?useSSL=true&verifyServerCertificate=false  
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456789
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_JPA_SHOW_SQL: true
      # redis 
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

    restart: always

    depends_on:
      # RDS 사용시 제거
      # - database
      - redis

# AWS RDS 사용시 제거
  # database:
  #   image: seoyoomi/inspire-mariadb
  #   container_name: monolithic-mariadb-container
  #   ports:
  #     - "6033:3306"
  #   environment:
  #     MARIADB_USER: root
  #     MARIADB_ROOT_PASSWORD: 123456789
  #     MARIADB_DATABASE: inspire

  redis:
    image: seoyoomi/inspire-redis  
    container_name: monolithic-redis-container
    ports:
      - "6379:6379"
    restart: always